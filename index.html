<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Kho Ảnh Của Tui - Bản Hoạt Động 100%</title>
    <style>
      body {
        font-family: Segoe UI;
        background: #111;
        color: #fff;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
      }
      h1 {
        text-align: center;
        margin: 30px 0;
        font-size: 3em;
        color: #0ff;
      }
      #drop {
        border: 5px dashed #0ff;
        padding: 100px;
        text-align: center;
        font-size: 2em;
        border-radius: 20px;
        margin: 40px 0;
        background: rgba(0, 255, 255, 0.1);
        cursor: pointer;
        transition: 0.3s;
      }
      #drop:hover {
        background: rgba(0, 255, 255, 0.2);
        transform: scale(1.02);
      }
      #gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }
      .item {
        position: relative;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 255, 255, 0.4);
        transition: 0.3s;
      }
      .item:hover {
        transform: translateY(-10px) scale(1.05);
      }
      .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        aspect-ratio: 1;
      }
      .info {
        text-align: center;
        font-size: 1.8em;
        margin: 20px;
        color: #0ff;
      }
      #lightbox {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      #lightbox.hidden {
        display: none;
      }
      #close {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 80px;
        cursor: pointer;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>KHO ẢNH CỦA TUI</h1>
    <div class="info">Kéo thả ảnh hoặc thư mục vào ô dưới đây nha!</div>
    <div id="drop">KÉO ẢNH VÀO ĐÂY ĐỂ LƯU VĨNH VIỄN</div>
    <div id="gallery"></div>

    <div id="lightbox" class="hidden">
      <div id="close">X</div>
      <img id="big" />
    </div>

    <script>
      const drop = document.getElementById("drop");
      const gallery = document.getElementById("gallery");
      let images = [];

      // Cho phép kéo thả
      ["dragover", "dragenter"].forEach((e) =>
        drop.addEventListener(e, (ev) => {
          ev.preventDefault();
          drop.style.background = "rgba(0,255,255,0.3)";
        })
      );
      ["dragleave", "drop"].forEach((e) =>
        drop.addEventListener(e, (ev) => {
          ev.preventDefault();
          drop.style.background = "";
        })
      );

      drop.ondrop = (e) => {
        e.preventDefault();
        [...e.dataTransfer.items].forEach((item) => {
          const entry = item.webkitGetAsEntry();
          if (entry.isFile) {
            entry.file((file) => addImage(file));
          } else if (entry.isDirectory) {
            scanFolder(entry);
          }
        });
      };

      // Quét thư mục con
      function scanFolder(entry) {
        const reader = entry.createReader();
        reader.readEntries((entries) => {
          entries.forEach((e) => {
            if (e.isFile) e.file((f) => addImage(f));
            else if (e.isDirectory) scanFolder(e);
          });
        });
      }

      // Thêm ảnh + tạo thumbnail
      function addImage(file) {
        if (!file.type.startsWith("image/")) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          // Tạo thumbnail
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = 400;
            canvas.height = 400;
            canvas.getContext("2d").drawImage(img, 0, 0, 400, 400);
            const thumb = canvas.toDataURL("image/webp");

            images.push({ name: file.name, full: e.target.result, thumb });
            render();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function render() {
        gallery.innerHTML = "";
        images.forEach((img) => {
          const div = document.createElement("div");
          div.className = "item";
          div.innerHTML = `<img src="${img.thumb}" loading="lazy">`;
          div.onclick = () => {
            document.getElementById("big").src = img.full;
            document.getElementById("lightbox").classList.remove("hidden");
          };
          gallery.appendChild(div);
        });
        document.querySelector(
          ".info"
        ).textContent = `Đã lưu ${images.length} ảnh vĩnh viễn trong trình duyệt!`;
      }

      document.getElementById("close").onclick = () =>
        document.getElementById("lightbox").classList.add("hidden");
    </script>
  </body>
</html>
